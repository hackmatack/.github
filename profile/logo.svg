  <text class="outline foliage" x="266" y="68">^</text>
  <g class="digit">
    <text class="foliage" x="278" y="68">0</text>
  </g>

  <text class="outline" x="266" y="92"><tspan class="foliage">/</tspan><tspan class="trunk">|</tspan></text>
