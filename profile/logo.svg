<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="100%" viewBox="0 0 540 540" role="img" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <style>
    @font-face {
      font-family: "Hack";
      font-weight: 400;
      font-style: normal;
      src: url("data:font/woff2;base64,") format("woff2");
    }
    text {
      font-family: "Hack";
      font-size: 16px;
